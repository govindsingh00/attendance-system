{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard — Smart Attend</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Shared Styles -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  
  <style>
    /* Styling for legacy tables/forms */
    .legacy-content h1 { font-size: 1.8rem; margin-bottom: 1rem; color: var(--navy); font-family: 'Poppins', sans-serif; font-weight: 600; }
    .legacy-content table { width: 100%; margin-bottom: 1rem; }
    .legacy-content table td, .legacy-content table th { padding: 12px; border-bottom: 1px solid var(--border-color); }
    .legacy-content table th { background-color: var(--light-bg); color: var(--navy); }
    .legacy-content form input, .legacy-content form select, .legacy-content form button { margin-bottom: 10px; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 400px; }
    .legacy-content form button { background-color: var(--primary); color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.2s ease; }
    .legacy-content form button:hover { background-color: var(--navy); }
  </style>
</head>
<body class="bg-light-custom d-flex flex-column min-vh-100">

  <!-- ============================================
       NAVBAR
       ============================================ -->
  <nav class="navbar navbar-expand-lg navbar-custom scrolled always-scrolled mb-4">
    <div class="container">
      <a class="navbar-brand" href="/student_home/">
        <i class="fas fa-graduation-cap"></i>
        Smart Attend
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#studentNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="studentNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="/student_home/">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/student_attendance/">My Attendance</a></li>
          <li class="nav-item"><a class="nav-link" href="/editstprofile/">Profile</a></li>
          <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
            <a class="btn btn-outline-custom btn-sm" href="/logout/">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ============================================
       DYNAMIC CONTENT
       ============================================ -->
  <section class="flex-grow-1 pt-5 mt-4">
    <div class="container pb-5">
      <div class="card-custom p-4 p-md-5 legacy-content">
        {% block s1 %}
        {% endblock %}
      </div>
    </div>
  </section>

  <!-- ============================================
       FOOTER
       ============================================ -->
  <footer class="site-footer mt-auto py-3">
    <div class="container text-center">
      <div class="small opacity-75">
        &copy; 2026 Smart Attend. All rights reserved.
      </div>
    </div>
  </footer>

  <!-- jQuery (for legacy compatibility) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared JS -->
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
